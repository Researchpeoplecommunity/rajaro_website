{% extends "admin/base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
<h1>Add Product</h1>
<form method="post" enctype="multipart/form-data" class="admin-form">
  <div class="form-group"><label>Name *</label><input type="text" name="name" required></div>
  <div class="form-group"><label>Slug</label><input type="text" name="slug" placeholder="auto-generated from name"></div>
  <div class="form-group"><label>Tagline</label><input type="text" name="tagline"></div>
  <div class="form-group"><label>Short Description</label><textarea name="short_description" rows="3"></textarea></div>
  <div class="form-group"><label>Full Description</label><textarea name="description" rows="6"></textarea></div>
  <div class="form-group"><label>Product Image</label><input type="file" name="image" accept="image/*"></div>
  <div class="form-group"><label>CTA Text</label><input type="text" name="cta_text" value="Try it"></div>
  <div class="form-group"><label>CTA URL</label><input type="url" name="cta_url"></div>
  <label><input type="checkbox" name="is_active" checked> Active</label>
  <button type="submit" class="btn btn-primary">Create Product</button>
</form>
{% endblock %}
