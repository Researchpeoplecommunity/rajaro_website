{% extends "admin/base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products <a href="{{ url_for('admin.add_product') }}" class="btn btn-sm btn-primary">Add Product</a></h1>
<table class="admin-table">
  <thead><tr><th>Order</th><th>Name</th><th>Slug</th><th>Active</th><th>Actions</th></tr></thead>
  <tbody>
    {% for p in products %}
    <tr>
      <td>{{ p.sort_order }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.slug }}</td>
      <td>{{ 'Yes' if p.is_active else 'No' }}</td>
      <td>
        <a href="{{ url_for('admin.edit_product', pid=p.id) }}">Edit</a>
        <form method="post" action="{{ url_for('admin.move_product', pid=p.id, direction='up') }}" style="display:inline"><button class="btn btn-sm">↑</button></form>
        <form method="post" action="{{ url_for('admin.move_product', pid=p.id, direction='down') }}" style="display:inline"><button class="btn btn-sm">↓</button></form>
        <form method="post" action="{{ url_for('admin.delete_product', pid=p.id) }}" style="display:inline" onsubmit="return confirm('Delete this product?')">
          <button class="btn btn-sm btn-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
