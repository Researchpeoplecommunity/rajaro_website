<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Rajaro Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-body">
  <div class="login-wrap">
    <form method="post" class="login-form" action="{{ url_for('admin.login') }}">
      <h1>Admin Login</h1>
      <p class="login-subtitle">Sign in to manage the Rajaro website.</p>
      {% if request.args.get('next') %}
      <input type="hidden" name="next" value="{{ request.args.get('next') }}">
      {% endif %}

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="admin-flash admin-flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary login-submit">Log In</button>
      <p class="login-back"><a href="{{ url_for('public.home') }}">← Back to website</a></p>
    </form>
  </div>
</body>
</html>
