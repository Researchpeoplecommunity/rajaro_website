{% extends "admin/base.html" %}
{% block title %}Edit Blog{% endblock %}
{% block content %}
<h1>Edit Blog Post</h1>
<form method="post" enctype="multipart/form-data" class="admin-form">
  <div class="form-group"><label>Title</label><input type="text" name="title" value="{{ post.title }}"></div>
  <div class="form-group"><label>Slug</label><input type="text" name="slug" value="{{ post.slug }}"></div>
  <div class="form-group"><label>Featured Image</label><input type="file" name="featured_image" accept="image/*"></div>
  {% if post.featured_image %}<p>Current: {{ post.featured_image }}</p>{% endif %}
  <div class="form-group"><label>Excerpt</label><textarea name="excerpt" rows="3">{{ post.excerpt or '' }}</textarea></div>
  <div class="form-group"><label>Content</label><textarea name="content" rows="12">{{ post.content or '' }}</textarea></div>
  <div class="form-group"><label>Published Date</label><input type="date" name="published_at" value="{{ post.published_at.isoformat() if post.published_at else '' }}"></div>
  <div class="form-group"><label>Display Order</label><input type="number" name="sort_order" value="{{ post.sort_order or 0 }}"></div>
  <label><input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}> Published</label>
  <button type="submit" class="btn btn-primary">Save</button>
</form>
<a href="{{ url_for('admin.blogs') }}">← Back</a>
{% endblock %}
