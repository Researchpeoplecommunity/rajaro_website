{% extends "admin/base.html" %}
{% block title %}Add Job{% endblock %}
{% block content %}
<h1>Add Job Posting</h1>
<form method="post" class="admin-form">
  <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
  <div class="form-group"><label>Mode</label><input type="text" name="mode"></div>
  <div class="form-group"><label>Job Type</label><input type="text" name="job_type"></div>
  <div class="form-group"><label>Shift</label><input type="text" name="shift"></div>
  <div class="form-group"><label>Location</label><input type="text" name="location"></div>
  <div class="form-group"><label>Openings</label><input type="number" name="openings" value="1"></div>
  <div class="form-group"><label>Income</label><input type="text" name="income"></div>
  <div class="form-group"><label>Skills</label><input type="text" name="skills"></div>
  <div class="form-group"><label>Reference Code *</label><input type="text" name="reference_code" required></div>
  <div class="form-group"><label>Expiry Date</label><input type="date" name="expiry_date"></div>
  <div class="form-group"><label>Education</label><input type="text" name="education"></div>
  <div class="form-group"><label>Gender</label><input type="text" name="gender" value="Any"></div>
  <div class="form-group"><label>Short Description</label><textarea name="short_description" rows="3"></textarea></div>
  <div class="form-group"><label>Full Description</label><textarea name="description" rows="10"></textarea></div>
  <label><input type="checkbox" name="is_active" checked> Active</label>
  <button type="submit" class="btn btn-primary">Create Job</button>
</form>
{% endblock %}
