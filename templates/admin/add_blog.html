{% extends "admin/base.html" %}
{% block title %}Add Blog{% endblock %}
{% block content %}
<h1>Add Blog Post</h1>
<form method="post" enctype="multipart/form-data" class="admin-form">
  <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
  <div class="form-group"><label>Slug (optional)</label><input type="text" name="slug"></div>
  <div class="form-group"><label>Featured Image</label><input type="file" name="featured_image" accept="image/*"></div>
  <div class="form-group"><label>Excerpt</label><textarea name="excerpt" rows="3"></textarea></div>
  <div class="form-group"><label>Content</label><textarea name="content" rows="12"></textarea></div>
  <div class="form-group"><label>Published Date</label><input type="date" name="published_at"></div>
  <div class="form-group"><label>Display Order</label><input type="number" name="sort_order" value="0"></div>
  <label><input type="checkbox" name="is_published" checked> Published</label>
  <button type="submit" class="btn btn-primary">Create</button>
</form>
{% endblock %}
