services:
  - type: web
    name: rajaro-website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: BEHIND_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        value: contact@rajaro.com
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_USE_TLS
        value: "1"
      - key: MAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rajaro-db
          property: connectionString

databases:
  - name: rajaro-db
    plan: free
    databaseName: rajaro
    user: rajaro
